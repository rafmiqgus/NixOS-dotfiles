# KColorScheme (dolphin, KF6 apps under QT_QPA_PLATFORMTHEME=kde) reads colours
# from kdeglobals, not the .colors file. Merge the scheme's [Colors:*]/
# [ColorEffects:*] groups into kdeglobals, keeping every other group (Icons,
# fonts, KFileDialog, ...). awk: drop old colour groups, keep the rest, append
# the fresh ones from the generated scheme.
post_hook = '''awk 'BEGIN{k=1} /^\[(Colors:|ColorEffects:)/{k=0} /^\[/{if($0 !~ /^\[(Colors:|ColorEffects:)/)k=1} k' ~/.config/kdeglobals > /tmp/kdeglobals.base && awk '/^\[(Colors:|ColorEffects:)/{p=1} /^\[/{if($0 !~ /^\[(Colors:|ColorEffects:)/)p=0} p' ~/.local/share/color-schemes/Matugen.colors > /tmp/kdeglobals.colors && cat /tmp/kdeglobals.base /tmp/kdeglobals.colors > ~/.config/kdeglobals && rm -f /tmp/kdeglobals.base /tmp/kdeglobals.colors'''

# Stays in the repo: parsed at build time by spicetify/default.nix (customColorScheme).
[templates.spicetify]
input_path = '/home/rafael/.dotfiles/home/config/matugen/templates/spotify-colors.ini'
output_path = '/home/rafael/.dotfiles/home/config/spicetify/Themes/Comfy/color.ini'

[templates.starship]
input_path = '/home/rafael/.dotfiles/home/config/matugen/templates/starship-colors.toml'
output_path = '/home/rafael/.cache/matugen/starship-palette.toml'
post_hook = "sed -i '/^palette = /d; /^\\[palettes\\./,$d' /home/rafael/.config/starship.toml && echo 'palette = \"matugen\"' >> /home/rafael/.config/starship.toml && cat /home/rafael/.cache/matugen/starship-palette.toml >> /home/rafael/.config/starship.toml"

# Stays in the repo: imported by nixos/configuration.nix at evaluation time.
[templates.kmscon]
input_path = '/home/rafael/.dotfiles/home/config/matugen/templates/kmscon-colors.nix'
output_path = '/home/rafael/.dotfiles/home/config/matugen/generated/kmscon-palette.nix'

[templates.zellij]
