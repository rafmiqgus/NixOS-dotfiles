# Generated by matugen. Spliced onto ~/.config/herdr/base.toml (HM-owned) to
# produce ~/.config/herdr/config.toml. Herdr has no include directive, so the
# final config is a concatenation. Edit this template, never the output.

# Base theme only seeds tokens not overridden below; every visible surface comes
# from [theme.custom]. Not "terminal": that follows kitty's ANSI palette, which
# drifts from the matugen scheme.
[theme]
name = "catppuccin"

[theme.custom]
accent        = "{{colors.primary.default.hex}}"
# panel_bg (tab bar, chrome) matches sidebar_bg so the two read as one surface.
panel_bg      = "{{colors.surface_container.default.hex}}"
sidebar_bg    = "{{colors.surface_container.default.hex}}"
active_row_bg = "{{colors.secondary_container.default.hex}}"
selection_bg  = "{{colors.surface_container_high.default.hex}}"
surface0      = "{{colors.surface_container_low.default.hex}}"
surface1      = "{{colors.surface_container_high.default.hex}}"
surface_dim   = "{{colors.surface_dim.default.hex}}"
overlay0      = "{{colors.outline_variant.default.hex}}"
overlay1      = "{{colors.outline.default.hex}}"
text          = "{{colors.on_surface.default.hex}}"
subtext0      = "{{colors.on_surface_variant.default.hex}}"
mauve         = "{{colors.tertiary.default.hex}}"
green         = "#9ec49f"
yellow        = "#c4c19e"
red           = "{{colors.error.default.hex}}"
blue          = "{{colors.primary.default.hex}}"
teal          = "#9ec3c4"
peach         = "{{colors.tertiary_fixed_dim.default.hex}}"
